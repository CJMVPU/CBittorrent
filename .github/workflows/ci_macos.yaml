name: Native macOS CI

on:
  push:
    branches: [master, codex]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-macos-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: macOS 27 / Apple Silicon
    # Explicitly select the macOS 27 arm64 image, not the moving macos-latest alias.
    runs-on: xcode-27
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      HOMEBREW_NO_ENV_HINTS: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Verify runner and SDK
        run: native/scripts/ci.sh environment

      - name: Install native dependencies and validators
        run: |
          brew update --quiet
          brew install cmake ninja pkgconf libtorrent-rasterbar actionlint shellcheck

      - name: Validate workflows and scripts
        run: |
          actionlint -color .github/workflows/*.yaml
          shellcheck native/build.sh native/tests/*.sh native/scripts/*.sh
          python3 -m compileall -q native/scripts
          git diff --check HEAD^ HEAD

      - name: Build, test and package native client
        run: native/scripts/ci.sh verify

      - name: Upload verified application
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: CBittorrent-macOS27-arm64-${{ github.sha }}
          path: |
            build/ci/artifacts/CBittorrent-macOS27-arm64.zip
            build/ci/artifacts/SHA256SUMS
            build/ci/artifacts/build-info.json
            build/ci/artifacts/environment.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-ci-logs-${{ github.sha }}
          path: |
            build/ci/Testing/Temporary/
            build/ci/verification.log
            build/ci/environment.txt
          if-no-files-found: warn
          retention-days: 7
